<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Encurtador de URL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #111318;
            --bg-card: #1a1d24;
            --border: #2a2d35;
            --text: #e2e4e9;
            --muted: #6b7280;
            --dim: #374151;
            --accent: #3b82f6;
            --accent-h: #60a5fa;
            --green: #22c55e;
            --red: #ef4444;
            --radius: 8px;
            --sans: 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--accent-h);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            border-left: 4px solid var(--accent-h);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .stat-card h3 {
            font-size: 0.9em;
            color: var(--muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--accent-h);
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .chart-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .chart-box h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: var(--accent-h);
        }
        
        canvas {
            max-height: 300px;
        }
        
        .table-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-top: 30px;
        }
        
        .table-box h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: var(--accent-h);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: var(--bg);
            padding: 12px;
            text-align: left;
            font-weight: bold;
            color: var(--accent-h);
            border-bottom: 2px solid var(--accent-h);
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        tr:hover {
            background: var(--dim);
        }
        
        .code {
            background: var(--bg);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: var(--mono);
            color: var(--accent-h);
        }
        
        .loading {
            text-align: center;
            color: var(--muted);
            margin: 20px 0;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.08);
            color: var(--red);
            padding: 15px;
            border-radius: var(--radius);
            margin: 20px 0;
        }
        
        nav {
            margin-bottom: 30px;
        }
        
        nav a {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accent-h);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
            font-weight: bold;
            transition: background 150ms;
        }
        
        nav a:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">← Voltar para Home</a>
        </nav>
        
        <header>
            <h1>📊 Analytics</h1>
        </header>
        
        <div class="stats-grid" id="statsGrid">
            <div class="loading">Carregando estatísticas...</div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-box">
                <h2>Links por Dia (Últimos 30)</h2>
                <canvas id="linksPerDayChart"></canvas>
            </div>
            <div class="chart-box">
                <h2>Distribuição de Cliques</h2>
                <canvas id="clicksChart"></canvas>
            </div>
        </div>
        
        <div class="table-box">
            <h2>Histórico de Links (Últimos 20)</h2>
            <table id="linksTable">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>URL Original</th>
                        <th>Cliques</th>
                        <th>Data</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="linksTableBody">
                    <tr>
                        <td colspan="5" class="loading">Carregando histórico...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let linksChart = null;
        let clicksChart = null;
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error('Erro ao carregar estatísticas');
                
                const stats = await response.json();
                
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <h3>Total de Links</h3>
                        <div class="value">${stats.total_links}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total de Cliques</h3>
                        <div class="value">${stats.total_cliques}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Links Criados Hoje</h3>
                        <div class="value">${stats.hoje}</div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="error">Erro ao carregar estatísticas: ${error.message}</div>
                `;
            }
        }
        
        async function loadLinks() {
            try {
                const response = await fetch('/api/links');
                if (!response.ok) throw new Error('Erro ao carregar links');
                
                const links = await response.json();
                
                const tbody = document.getElementById('linksTableBody');
                
                if (links.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">Nenhum link criado ainda</td></tr>';
                    return;
                }
                
                tbody.innerHTML = links.map(link => `
                    <tr>
                        <td><span class="code">${link.codigo}</span></td>
                        <td title="${link.url_original}">${link.url_original.substring(0, 50)}${link.url_original.length > 50 ? '...' : ''}</td>
                        <td>${link.cliques}</td>
                        <td>${link.data_cadastro}</td>
                        <td>${link.expirado ? '<span style="color: #ff6b6b;">Expirado</span>' : '<span style="color: #4ade80;">Ativo</span>'}</td>
                    </tr>
                `).join('');
                
                updateCharts(links);
            } catch (error) {
                console.error(error);
                document.getElementById('linksTableBody').innerHTML = `
                    <tr><td colspan="5" class="error">Erro ao carregar links: ${error.message}</td></tr>
                `;
            }
        }
        
        function updateCharts(links) {
            // Gráfico de links por dia
            const dayMap = {};
            links.forEach(link => {
                const day = link.data_cadastro;
                dayMap[day] = (dayMap[day] || 0) + 1;
            });
            
            const days = Object.keys(dayMap).sort().slice(-30);
            const counts = days.map(day => dayMap[day]);
            
            const linksCtx = document.getElementById('linksPerDayChart').getContext('2d');
            if (linksChart) linksChart.destroy();
            linksChart = new Chart(linksCtx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Links Criados',
                        data: counts,
                        backgroundColor: '#60a5fa',
                        borderColor: '#3b82f6',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: '#e0e0e0' }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#e2e4e9' },
                            grid: { color: '#2a2d35' }
                        },
                        x: {
                            ticks: { color: '#e2e4e9' },
                            grid: { color: '#2a2d35' }
                        }
                    }
                }
            });
            
            // Gráfico de distribuição de cliques (top 10 links)
            const topLinks = links
                .sort((a, b) => b.cliques - a.cliques)
                .slice(0, 10)
                .map(link => ({
                    codigo: link.codigo,
                    cliques: link.cliques
                }));
            
            const clicksCtx = document.getElementById('clicksChart').getContext('2d');
            if (clicksChart) clicksChart.destroy();
            clicksChart = new Chart(clicksCtx, {
                type: 'doughnut',
                data: {
                    labels: topLinks.map(l => l.codigo),
                    datasets: [{
                        data: topLinks.map(l => l.cliques),
                        backgroundColor: [
                            '#60a5fa', '#ef4444', '#22c55e', '#f59e0b',
                            '#a78bfa', '#f87171', '#10b981', '#3b82f6',
                            '#fbbf24', '#fb7185'
                        ],
                        borderColor: '#1a1d24',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: '#e2e4e9' }
                        }
                    }
                }
            });
        }
        
        // Carregar dados ao abrir a página
        loadStats();
        loadLinks();
        
        // Atualizar a cada 30 segundos
        setInterval(() => {
            loadStats();
            loadLinks();
        }, 30000);
    </script>
</body>
</html>
